
---
services:
  nginx:
    build:
      context: ./
      dockerfile: "Dockerfile.nginx-alpine"
    image: "aist/aist-nginx:${NGINX_VERSION:-latest}"
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "${NGINX_METRICS_ENABLED:-false}"
      DD_UWSGI_HOST: "${DD_UWSGI_HOST:-uwsgi}"
      DD_UWSGI_PORT: "${DD_UWSGI_PORT:-3031}"
      AIST_DOMAIN: "${AIST_DOMAIN:-_}"
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      GENERATE_TLS_CERTIFICATE: "${GENERATE_TLS_CERTIFICATE:-true}"
      USE_TLS: "${USE_TLS:-true}"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
      - type: bind
        source: ${ACME_WEBROOT_HOST:-/tmp/aist/acme-webroot}
        target: /var/www/certbot
      - type: bind
        source: ${NGINX_SSL_HOST_DIR:-/tmp/aist/nginx-ssl}
        target: /etc/nginx/ssl
        read_only: true
      - type: bind
        source: ./docker/nginx/client_ui.conf
        target: /etc/nginx/nginx.conf
      - type: bind
        source: ./docker/nginx/client_ui_tls.conf
        target: /etc/nginx/nginx_TLS.conf
    ports:
      - target: 8080
        published: ${DD_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${DD_TLS_PORT:-443}
        protocol: tcp
        mode: host
  uwsgi:
    build:
      context: ./
      dockerfile: "Dockerfile.django-${DEFECT_DOJO_OS:-debian}"
      target: release
    image: "aist/aist-django:${DJANGO_VERSION:-latest}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}', '-t', '30', '--', '/entrypoint-uwsgi.sh']
    user: 0:0
    environment:
      DD_DEBUG: 'False'
      DD_DJANGO_METRICS_ENABLED: "${DD_DJANGO_METRICS_ENABLED:-False}"
      DD_ALLOWED_HOSTS: "${DD_ALLOWED_HOSTS:-*}"
      DD_SITE_URL: "${DD_SITE_URL:-http://localhost:8080}"
      DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-[]}"
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      DD_SESSION_COOKIE_SECURE: "${DD_SESSION_COOKIE_SECURE:-True}"
      DD_CSRF_COOKIE_SECURE: "${DD_CSRF_COOKIE_SECURE:-True}"
      DD_LOGOUT_ALL_SESSIONS: "${DD_LOGOUT_ALL_SESSIONS:-False}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_APP_NAME: "${GITHUB_APP_NAME:-}"
      WEBHOOK_TYPE: "${WEBHOOK_TYPE:-}"
      PRIVATE_KEY: "${PRIVATE_KEY:-}"
      DD_DATABASE_URL: ${DD_DATABASE_URL:-postgresql://defectdojo:defectdojo@postgres:5432/defectdojo}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_EMAIL_USE_TLS: "${DD_EMAIL_USE_TLS:-}"
      DD_EMAIL_USE_SSL: "${DD_EMAIL_USE_SSL:-}"
      DD_EMAIL_URL: "${DD_EMAIL_URL:-smtp://mailhog:1025}"
      DD_EMAIL_BACKEND: "${DD_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
      DD_DEFAULT_FROM_EMAIL: "${DD_DEFAULT_FROM_EMAIL:-}"
      DD_SERVER_EMAIL: "${DD_SERVER_EMAIL:-}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-hhZCp@D28z!n@NED*yB!ROMt+WzsY*iq}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:-&91a*agLqesc*0DJ+2*bAbsUZfR*4nLw}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
      CLAUDE_DIFF_MAX_FILES: "${CLAUDE_DIFF_MAX_FILES:-1500}"
      CLAUDE_DIFF_MAX_BYTES: "${CLAUDE_DIFF_MAX_BYTES:-6000000}"
      AGENT_FULL_MAX_FILES: "${AGENT_FULL_MAX_FILES:-16000}"
      AGENT_FULL_MAX_BYTES: "${AGENT_FULL_MAX_BYTES:-100000000}"
      AGENT_FULL_MAX_FILE_BYTES: "${AGENT_FULL_MAX_FILE_BYTES:-300000}"
      AGENT_FULL_MAX_FINDINGS: "${AGENT_FULL_MAX_FINDINGS:-50}"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
        - "defectdojo_media:${DD_MEDIA_ROOT:-/app/media}"
  celerybeat:
    image: "aist/aist-django:${DJANGO_VERSION:-latest}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}', '-t', '30', '--', '/entrypoint-celery-beat.sh']
    environment:
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      DD_DATABASE_URL: ${DD_DATABASE_URL:-postgresql://defectdojo:defectdojo@postgres:5432/defectdojo}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_SECRET_KEY: "${DD_SECRET_KEY:-hhZCp@D28z!n@NED*yB!ROMt+WzsY*iq}"
      DD_SITE_URL: "${DD_SITE_URL:-http://localhost:8080}"
      DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-[]}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:-&91a*agLqesc*0DJ+2*bAbsUZfR*4nLw}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
  celeryworker:
    image: "aist/aist-django:${DJANGO_VERSION:-latest}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}', '-t', '30', '--', '/entrypoint-celery-worker.sh']
    user: 0:0
    environment:
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      C_FORCE_ROOT: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "${DOCKER_BUILDKIT:-1}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_APP_NAME: "${GITHUB_APP_NAME:-}"
      WEBHOOK_TYPE: "${WEBHOOK_TYPE:-}"
      PRIVATE_KEY: "${PRIVATE_KEY:-}"
      DD_CELERY_WORKER_POOL_TYPE: "${DD_CELERY_WORKER_POOL_TYPE:-prefork}"
      DD_CELERY_WORKER_CONCURRENCY: "${DD_CELERY_WORKER_CONCURRENCY:-6}"
      DD_CELERY_WORKER_AUTOSCALE_MAX: "${DD_CELERY_WORKER_AUTOSCALE_MAX:-8}"
      DD_CELERY_WORKER_AUTOSCALE_MIN: "${DD_CELERY_WORKER_AUTOSCALE_MIN:-2}"
      DD_CELERY_WORKER_PREFETCH_MULTIPLIER: "${DD_CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
      DD_CELERY_LOG_LEVEL: "${DD_CELERY_LOG_LEVEL:-INFO}"
      DD_DATABASE_URL: ${DD_DATABASE_URL:-postgresql://defectdojo:defectdojo@postgres:5432/defectdojo}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_EMAIL_USE_TLS: "${DD_EMAIL_USE_TLS:-}"
      DD_EMAIL_USE_SSL: "${DD_EMAIL_USE_SSL:-}"
      DD_EMAIL_URL: "${DD_EMAIL_URL:-smtp://mailhog:1025}"
      DD_DEFAULT_FROM_EMAIL: "${DD_DEFAULT_FROM_EMAIL:-}"
      DD_SERVER_EMAIL: "${DD_SERVER_EMAIL:-}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-hhZCp@D28z!n@NED*yB!ROMt+WzsY*iq}"
      DD_SITE_URL: "${DD_SITE_URL:-http://localhost:8080}"
      DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-[]}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:-&91a*agLqesc*0DJ+2*bAbsUZfR*4nLw}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
      AIST_LOCAL_TRIAGE_TIMEOUT: "${AIST_LOCAL_TRIAGE_TIMEOUT:-10800}"
      AIST_LOCAL_TRIAGE_BRIDGE_SOCKET: /run/claude-bridge/bridge.sock
      CLAUDE_DIFF_MAX_FILES: "${CLAUDE_DIFF_MAX_FILES:-1500}"
      CLAUDE_DIFF_MAX_BYTES: "${CLAUDE_DIFF_MAX_BYTES:-6000000}"
      AGENT_FULL_MAX_FILES: "${AGENT_FULL_MAX_FILES:-16000}"
      AGENT_FULL_MAX_BYTES: "${AGENT_FULL_MAX_BYTES:-100000000}"
      AGENT_FULL_MAX_FILE_BYTES: "${AGENT_FULL_MAX_FILE_BYTES:-300000}"
      AGENT_FULL_MAX_FINDINGS: "${AGENT_FULL_MAX_FINDINGS:-50}"
      AIST_VPN_ORPHAN_MAX_AGE_MINUTES: "${AIST_VPN_ORPHAN_MAX_AGE_MINUTES:-240}"
    extra_hosts:
      # Allows VPN sidecar SOCKS5 proxy to be reached from inside this container
      # via host.docker.internal on Linux Docker Engine (Docker Desktop provides it automatically).
      - "host.docker.internal:host-gateway"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
        - "defectdojo_media:${DD_MEDIA_ROOT:-/app/media}"
        - /var/run/docker.sock:/var/run/docker.sock
        - type: bind
          source: ${AIST_TMP_DIR:-/tmp/aist}
          target: /tmp/aist
        - claude_bridge_sock:/run/claude-bridge
  initializer:
    image: "aist/aist-django:${DJANGO_VERSION:-latest}"
    depends_on:
      postgres:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}', '--', '/entrypoint-initializer.sh']
    environment:
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_APP_NAME: "${GITHUB_APP_NAME:-}"
      WEBHOOK_TYPE: "${WEBHOOK_TYPE:-}"
      PRIVATE_KEY: "${PRIVATE_KEY:-}"
      DD_DATABASE_URL: ${DD_DATABASE_URL:-postgresql://defectdojo:defectdojo@postgres:5432/defectdojo}
      AIST_SERVICE_TOKEN: "${AIST_SERVICE_TOKEN:-}"
      DD_ADMIN_USER: "${DD_ADMIN_USER:-admin}"
      DD_ADMIN_MAIL: "${DD_ADMIN_USER:-admin@defectdojo.local}"
      DD_ADMIN_FIRST_NAME: "${DD_ADMIN_FIRST_NAME:-Admin}"
      DD_ADMIN_LAST_NAME: "${DD_ADMIN_LAST_NAME:-User}"
      DD_INITIALIZE: "${DD_INITIALIZE:-true}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-hhZCp@D28z!n@NED*yB!ROMt+WzsY*iq}"
      DD_SITE_URL: "${DD_SITE_URL:-http://localhost:8080}"
      DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-[]}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:-&91a*agLqesc*0DJ+2*bAbsUZfR*4nLw}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
  postgres:
    image: postgres:18.1-alpine@sha256:b40d931bd0e7ce6eecc59a5a6ac3b3c04a01e559750e73e7086b6dbd7f8bf545
    environment:
      POSTGRES_DB: ${DD_DATABASE_NAME:-defectdojo}
      POSTGRES_USER: ${DD_DATABASE_USER:-defectdojo}
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:-defectdojo}
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:7.2.11-alpine@sha256:9e483e0fe4c98b631b166b41d530c7ff1b8009a44f261bff28e9d1e2e27db58d
    volumes:
      # we keep using the redis volume as renaming is not possible and copying data over
      # would require steps during downtime or complex commands in the intializer
      - defectdojo_redis:/data
  vpn-sidecar:
    build:
      context: ./sast-combinator/vpn-sidecar
      dockerfile: Dockerfile
    image: "aist-vpn-sidecar:v2"
    # This service exists only to make `docker compose build` rebuild the VPN sidecar image.
    # The image is started on-demand by vpn_sidecar_context() in aist/utils/vpn.py — not by
    # docker compose up. The entrypoint is overridden, not the command: the image declares its
    # own ENTRYPOINT, so a `command: ["true"]` was passed to it as an argument and exited
    # non-zero on every boot — a permanently failed service that masked real VPN errors.
    # A profile would exclude it from `docker compose build` too, defeating its only purpose.
    entrypoint: ["true"]
    restart: "no"

  claude-bridge:
    build:
      context: ./tools/aist-triage-bridge
      dockerfile: Dockerfile
    # Run uvicorn under tini so claude grandchildren that outlive the CLI
    # are reaped. Without this they accumulate as zombies under PID 1
    # (uvicorn) and keep the parent's pipe FDs alive — one of the failure
    # modes that hung the bridge after SIGKILL on the claude CLI.
    init: true
    depends_on:
      uwsgi:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AIST_TMP_DIR:-/tmp/aist}
        target: /tmp/aist
      - claude_bridge_sock:/run/claude-bridge
      - type: bind
        source: ./
        target: /app/aist
        read_only: true
      - defectdojo_media:${DD_MEDIA_ROOT:-/app/media}
    environment:
      AIST_WORKING_DIR: /app/aist
      AIST_SERVICE_TOKEN: "${AIST_SERVICE_TOKEN:-}"
      AIST_LOCAL_TRIAGE_TIMEOUT: "${AIST_LOCAL_TRIAGE_TIMEOUT:-10800}"
      AIST_LOCAL_TRIAGE_BRIDGE_SOCKET: /run/claude-bridge/bridge.sock
      AIST_LOG_DIR: "${DD_MEDIA_ROOT:-/app/media}/aist_logs"
    healthcheck:
      test: ["CMD-SHELL", "curl --unix-socket /run/claude-bridge/bridge.sock http://localhost/health -sf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  defectdojo_postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AIST_POSTGRES_DATA_DIR:-/tmp/aist/postgres}
  defectdojo_media: {}
  defectdojo_redis: {}
  claude_bridge_sock: {}

<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">AIST platform building blocks</title>
  <desc id="desc">Product requests enter React and Django. PostgreSQL stores durable state, Valkey transports tasks from Django and Celery Beat to workers, and workers coordinate SAST, provider, and local AI execution boundaries.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:700}.group{font-size:17px;font-weight:700}.name{font-size:14px;font-weight:700}.detail{font-size:12px;fill:#52616b}.lane{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5;rx:16}.box{stroke:#52616b;stroke-width:1.5;rx:11}.flow{fill:none;stroke:#596a78;stroke-width:2;marker-end:url(#arrow)}.queue{fill:none;stroke:#7d69aa;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:none;stroke:#8b98a4;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596a78"/></marker>
  </defs>
  <rect width="1160" height="760" fill="#fbfcfd"/>
  <text x="50" y="45" class="title">AIST platform building blocks</text>
  <text x="50" y="68" class="detail">Solid: request or durable state · purple: queued work · dashed: execution or analysis boundary</text>

  <rect x="40" y="92" width="1080" height="125" class="lane"/>
  <text x="65" y="120" class="group">Product experience and control plane</text>
  <rect x="165" y="143" width="230" height="55" class="box" fill="#edf5ff"/>
  <text x="188" y="167" class="name">React client</text><text x="188" y="187" class="detail">product interaction</text>
  <rect x="595" y="143" width="300" height="55" class="box" fill="#edf5ff"/>
  <text x="618" y="167" class="name">Django control plane</text><text x="618" y="187" class="detail">API · authorization · workflow</text>
  <path d="M395 171H595" class="flow"/><text x="470" y="159" class="detail">HTTP</text>

  <rect x="40" y="238" width="1080" height="145" class="lane"/>
  <text x="65" y="268" class="group">Durable coordination</text>
  <rect x="220" y="295" width="275" height="65" class="box" fill="#eaf8f1"/>
  <text x="243" y="321" class="name">PostgreSQL</text><text x="243" y="343" class="detail">tenant, product, launch, pipeline, finding state</text>
  <rect x="665" y="295" width="275" height="65" class="box" fill="#fff8e8"/>
  <text x="688" y="321" class="name">Valkey</text><text x="688" y="343" class="detail">Celery delivery, not product history</text>
  <path d="M670 198L430 295" class="flow"/><text x="500" y="255" class="detail">read / write</text>
  <path d="M780 198L820 295" class="queue"/><text x="815" y="255" class="detail">enqueue</text>

  <rect x="40" y="405" width="1080" height="315" class="lane"/>
  <text x="65" y="435" class="group">Background work</text>
  <rect x="105" y="468" width="185" height="60" class="box" fill="#f4efff"/>
  <text x="128" y="493" class="name">Celery Beat</text><text x="128" y="514" class="detail">recurring producers</text>
  <rect x="488" y="468" width="185" height="60" class="box" fill="#f4efff"/>
  <text x="511" y="493" class="name">Celery workers</text><text x="511" y="514" class="detail">orchestration and outcomes</text>
  <path d="M198 468V442H790V360" class="queue"/>
  <path d="M815 360V448H620V468" class="queue"/>
  <path d="M515 468L400 360" class="flow"/>

  <text x="65" y="570" class="group">Execution and analysis boundaries</text>
  <rect x="150" y="600" width="220" height="70" class="box" fill="#fff0f0"/>
  <text x="172" y="627" class="name">SAST runtime</text><text x="172" y="648" class="detail">workspace · builder · analyzers</text>
  <rect x="470" y="600" width="220" height="70" class="box" fill="#fff0f0"/>
  <text x="492" y="627" class="name">Provider connector</text><text x="492" y="648" class="detail">standalone execution, for example DAST</text>
  <rect x="790" y="600" width="220" height="70" class="box" fill="#fff0f0"/>
  <text x="812" y="627" class="name">Local AI bridge</text><text x="812" y="648" class="detail">Unix socket · isolated CLI run</text>
  <path d="M535 528L260 600" class="boundary"/>
  <path d="M558 528L580 600" class="boundary"/>
  <path d="M603 528L900 600" class="boundary"/>
  <text x="70" y="700" class="detail">Execution services return reports or verdicts through platform boundaries; PostgreSQL remains authoritative.</text>
</svg>
